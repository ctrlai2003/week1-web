<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프로젝트 소개</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 헤더 섹션 -->
    <header class="header">
        <div class="container">
            <h1 class="main-title" id="mainTitle">프로젝트 제목</h1>
            <p class="subtitle" id="subtitle">프로젝트에 대한 간단한 소개 문구입니다. 내용은 나중에 쉽게 수정할 수 있습니다.</p>
            <button class="cta-button" id="changeTextBtn">내용 변경하기</button>
        </div>
    </header>

    <!-- 메인 컨텐츠 -->
    <main class="main-content">
        <div class="container">
            <section class="cards-section">
                <div class="card">
                    <div class="card-icon">🚀</div>
                    <h2 class="card-title">특징 1</h2>
                    <p class="card-description">프로젝트의 첫 번째 주요 특징을 설명합니다. 간단하고 명확하게 작성하세요.</p>
                </div>

                <div class="card">
                    <div class="card-icon">💡</div>
                    <h2 class="card-title">특징 2</h2>
                    <p class="card-description">프로젝트의 두 번째 주요 특징을 설명합니다. 핵심 가치를 전달하세요.</p>
                </div>

                <div class="card">
                    <div class="card-icon">⭐</div>
                    <h2 class="card-title">특징 3</h2>
                    <p class="card-description">프로젝트의 세 번째 주요 특징을 설명합니다. 장점을 강조하세요.</p>
                </div>
            </section>
        </div>
    </main>

    <!-- 푸터 -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 프로젝트 이름. 모든 권리 보유.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
